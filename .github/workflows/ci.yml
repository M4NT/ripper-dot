name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web (Vite)
        run: npm run build

      # Abre todas as telas num navegador de verdade e manda um prompt com ferramentas.
      # Pega o que os testes de Node não veem (ex.: tela "Algo quebrou" no chat).
      - name: Install Firefox (Playwright)
        run: npx playwright install --with-deps firefox

      - name: UI smoke
        run: npm run test:ui

      # As tarefas de referência no provedor de teste (não gasta nada): garante que o benchmark roda.
      - name: Benchmark (dry-run)
        run: node scripts/benchmark.mjs --limit 5 --out "$RUNNER_TEMP/benchmark.json"
